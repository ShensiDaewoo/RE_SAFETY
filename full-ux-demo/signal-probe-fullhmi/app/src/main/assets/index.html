<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RE:SAFETY Full HMI Final Concept</title>
<style>
/* Design canvas 2560x1440; 1rem = 100 design px, scaled to the viewport. */
html{font-size:min(calc(100vw / 25.6),calc(100vh / 14.4))}
/* Design tokens. Every function card (protect, guide, seat, tow, pre-drive check, record, resume row) takes its type from the --card-* tokens;
   the two emergency banners share family, weight and line height and differ only by --banner-title-size. */
:root{
  --font-ui:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif;
  --card-title-size:.46rem;--card-title-weight:700;--card-title-lh:1.25;--card-title-ls:0;
  --card-sub-size:.29rem;--card-sub-weight:500;--card-sub-lh:1.3;
  --banner-title-size:.54rem;
  --card-pad-x:.32rem;--card-gap:.28rem;--card-radius:.24rem;--card-icon:.9rem;
  /* driving-view photo background (HMI_BG_01/02, 4:5): width-fit, shifted up so the vehicle band sits between the headline and the buttons */
  --bg-size:100%;--bg-shift:-1rem;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100vh;overflow:hidden;background:#05070b;color:#151924;font-family:var(--font-ui);user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left}
b{font-weight:700}
#stage{position:absolute;left:50%;top:50%;width:25.6rem;height:14.4rem;transform:translate(-50%,-50%);background:radial-gradient(120% 90% at 70% 40%,#141926 0,#0a0d14 55%,#07090e 100%);overflow:hidden}
/* ---------- top strip (concept of the system status bar) ---------- */
#top{position:absolute;left:0;right:0;top:0;height:.82rem;z-index:6;color:#fff;font-size:.3rem;border-bottom:.015rem solid rgba(255,255,255,.13);background:linear-gradient(rgba(6,8,13,.92),rgba(6,8,13,.72))}
#top>*{position:absolute;top:50%;transform:translateY(-50%)}
.logo{left:.6rem;display:flex;align-items:center;gap:.14rem;font-size:.33rem;font-weight:800;letter-spacing:.005rem}
.logo svg{width:.36rem;height:.3rem}
.vd{width:.015rem;height:.4rem;background:rgba(255,255,255,.35)}
.lanechip{left:4.13rem;width:.86rem;height:.44rem;border-radius:.07rem;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center}
.lanechip svg{width:.34rem;height:.34rem}
#top small{font-size:.26rem;margin-left:.05rem}
#chips{left:10.62rem;display:flex;align-items:center;gap:.14rem}
.chip{font-size:.19rem;font-weight:800;border-radius:.3rem;padding:.07rem .2rem;letter-spacing:.01rem;white-space:nowrap;line-height:1.3}
.chip.concept{background:rgba(58,47,18,.9);color:#ffd391;border:.02rem solid rgba(255,179,64,.6)}
.chip.sim{background:#D2334A;color:#fff}
.chip.ctl{background:rgba(255,255,255,.1);color:#e8ebf0;border:.02rem solid rgba(255,255,255,.3)}
#tr{right:.42rem;display:flex;align-items:center;gap:.36rem}
#tr svg{width:.4rem;height:.4rem}
.avatar{width:.62rem;height:.62rem;border-radius:50%;border:.02rem solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#d9a7ff;font-size:.28rem;font-weight:700;display:flex;align-items:center;justify-content:center}
/* ---------- left: driving view concept ---------- */
#left{position:absolute;left:0;top:.82rem;width:10.3rem;bottom:0;color:#fff;overflow:hidden;background:#0b0e15}
#scene{position:absolute;left:0;right:0;top:0;height:8.75rem}
#scene svg,#scene canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
/* Photo background layer (ASSET_CONTRACT: HMI_BG_01_NORMAL / HMI_BG_02_ACCIDENT). Connected only when BOTH files are bundled (data-bg="photo");
   a state change swaps the image URL through the attribute, the DOM stays. The picture carries no text or UI: those stay HTML above it. */
#bg{position:absolute;left:0;right:0;top:0;bottom:0;display:none;background-repeat:no-repeat;background-size:var(--bg-size) auto;background-position:50% var(--bg-shift)}
/* The photo is painted by #sceneFx (the layer right above the vector drawing): shade on top, photo below it, solid colour at the bottom, so the
   vector drawing underneath is fully covered. The layer ends above the icon rows (10.1rem): the page keeps exactly the structure of the vector build; only this one layer differs. */
#left[data-bg="photo"]{--bg-size:100%;--bg-shift:-.34rem;--bg-photo:url("assets/hmi/HMI_BG_01_NORMAL.png")}
#left[data-bg="photo"][data-driving-state="accident"]{--bg-photo:url("assets/hmi/HMI_BG_02_ACCIDENT.png")}
#left[data-bg="photo"] #sceneFx{height:10.1rem;background:linear-gradient(rgba(6,8,13,.86) 0,rgba(6,8,13,.62) 2.2rem,rgba(8,10,16,.3) 3.7rem,rgba(8,10,16,0) 4.9rem,rgba(11,14,21,0) 8.2rem,rgba(11,14,21,.7) 9.3rem,#0b0e15 100%),radial-gradient(7.4rem 5.6rem at 52% 6.3rem,rgba(4,6,10,0) 58%,rgba(4,6,10,.5) 100%),var(--bg-photo) 50% var(--bg-shift)/var(--bg-size) auto no-repeat #0b0e15}
body.acc #left[data-bg="photo"] #sceneFx{background:radial-gradient(4.6rem 2.2rem at 50% 1.05rem,rgba(255,45,70,.15) 0,rgba(255,45,70,0) 100%),linear-gradient(rgba(10,7,12,.86) 0,rgba(10,7,12,.62) 2.2rem,rgba(10,8,14,.3) 3.7rem,rgba(10,8,14,0) 4.9rem,rgba(11,14,21,0) 8.2rem,rgba(11,14,21,.7) 9.3rem,#0b0e15 100%),radial-gradient(7.4rem 5.6rem at 52% 6.3rem,rgba(4,6,10,0) 58%,rgba(4,6,10,.5) 100%),var(--bg-photo) 50% var(--bg-shift)/var(--bg-size) auto no-repeat #0b0e15}
/* MASTER pass (left = lead): glass call-to-action buttons, moving emergency lights, hazard lamps, quiet label, calmer glow. Photo mode only. */
#left[data-bg="photo"] .cbtn{background:linear-gradient(rgba(26,30,41,.7),rgba(11,14,21,.8));border-color:rgba(255,255,255,.36);-webkit-backdrop-filter:blur(.14rem) saturate(1.2);backdrop-filter:blur(.14rem) saturate(1.2);box-shadow:0 .1rem .32rem rgba(0,0,0,.5),inset 0 .02rem 0 rgba(255,255,255,.18)}
#left[data-bg="photo"] .cbtn.red{background:linear-gradient(rgba(104,22,38,.8),rgba(58,12,23,.84));border-color:#ff7184;box-shadow:0 .1rem .32rem rgba(0,0,0,.5),0 0 .16rem rgba(255,60,80,.3),inset 0 .02rem 0 rgba(255,170,180,.28)}
#left[data-bg="photo"] .cbtn .tx span{color:#e4e7ed}
#left[data-bg="photo"] .cbtn.red .tx span{color:#ffb6bf}
#left[data-bg="photo"] #headline h1{text-shadow:0 .02rem .14rem rgba(0,0,0,.92),0 0 .5rem rgba(0,0,0,.5)}
#left[data-bg="photo"] #headline p{color:#f3f5f8;text-shadow:0 .02rem .1rem rgba(0,0,0,.95),0 0 .36rem rgba(0,0,0,.55)}
#left[data-bg="photo"] .simchip{position:absolute;left:.32rem;top:.14rem;margin:0;text-align:left;font-size:.185rem;font-weight:600;line-height:1.42;letter-spacing:0;color:#ffdfae;border:0;border-left:.03rem solid rgba(255,186,84,.85);border-radius:0;padding:.01rem 0 .01rem .12rem;background:none;text-shadow:0 .01rem .08rem rgba(0,0,0,.9)}
#left[data-bg="photo"] .simchip i{display:block;height:0;overflow:hidden}
body.acc #left[data-bg="photo"] .gear b{box-shadow:0 0 .16rem rgba(255,70,90,.42),inset 0 0 .1rem rgba(255,70,90,.3)}
body.acc #left[data-bg="photo"] #sceneFx::before,body.acc #left[data-bg="photo"] #sceneFx::after{content:"";position:absolute;left:1.3rem;top:4.2rem;width:1.9rem;height:3.4rem;pointer-events:none;mix-blend-mode:screen}
body.acc #left[data-bg="photo"] #sceneFx::before{background:radial-gradient(.34rem .22rem at 41% 20.500%,rgba(255,70,90,.95) 0,rgba(255,60,80,0) 100%),radial-gradient(.42rem 1.15rem at 43% 60%,rgba(255,50,70,.3) 0,rgba(255,50,70,0) 100%);animation:flash .66s steps(1) infinite}
body.acc #left[data-bg="photo"] #sceneFx::after{background:radial-gradient(.34rem .22rem at 63% 20.500%,rgba(90,150,255,.95) 0,rgba(70,130,255,0) 100%),radial-gradient(.42rem 1.15rem at 61% 60%,rgba(70,130,255,.28) 0,rgba(70,130,255,0) 100%);animation:flash .66s steps(1) infinite reverse}
body.acc #left[data-bg="photo"] #headline::after{content:"";position:absolute;left:0;top:-.2rem;width:10.3rem;height:8rem;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(.5rem .26rem at 2.92rem 6.4rem,rgba(255,176,48,.7) 0,rgba(255,150,30,0) 100%),radial-gradient(.62rem .3rem at 5.62rem 6.56rem,rgba(255,176,48,.78) 0,rgba(255,150,30,0) 100%);animation:blink 1s steps(1) infinite}
#left[data-bg="photo"] #syscap{color:rgba(255,255,255,.5)}
#left[data-bg="photo"] .cbtn.red{background:linear-gradient(rgba(104,22,38,.8),rgba(58,12,23,.84))}
#left[data-bg="photo"] .cbtn.go{background:linear-gradient(rgba(18,40,74,.78),rgba(14,30,56,.66))}
#sceneFx{position:absolute;left:0;right:0;top:0;height:8.75rem;pointer-events:none;background:linear-gradient(rgba(8,10,16,.82) 0,rgba(8,10,16,.5) 30%,rgba(8,10,16,0) 52%,rgba(11,14,21,0) 84%,#0b0e15 100%)}
body.acc #sceneFx{background:radial-gradient(60% 34% at 50% 14%,rgba(255,45,70,.26) 0,rgba(255,45,70,0) 100%),linear-gradient(rgba(12,8,14,.84) 0,rgba(12,8,14,.5) 30%,rgba(12,8,14,0) 52%,rgba(11,14,21,0) 84%,#0b0e15 100%)}
.gear{position:absolute;right:.3rem;top:.34rem;display:flex;align-items:center;gap:.2rem;font-size:.37rem;color:#aeb4bf;letter-spacing:.01rem;z-index:3}
.gear b{color:#fff;border:.03rem solid #dfe3ea;border-radius:.08rem;padding:0 .13rem;font-weight:600;line-height:1.35}
body.acc .gear b{border-color:#ff5a6e;color:#ffc2ca;box-shadow:0 0 .22rem rgba(255,70,90,.65),inset 0 0 .12rem rgba(255,70,90,.4)}
.adas{position:absolute;right:.44rem;top:1.12rem;width:.56rem;height:.86rem;z-index:3}
#headline{position:absolute;left:0;right:0;top:.2rem;text-align:center;z-index:2}
#headline svg{width:6.2rem;height:1.42rem;display:block;margin:0 auto}
#headline h1{margin:.06rem 0 0;font-size:.5rem;font-weight:700;letter-spacing:-.01rem;text-shadow:0 .02rem .12rem rgba(0,0,0,.8)}
#headline p{margin:.12rem .6rem 0;font-size:.265rem;line-height:1.48;color:#eef0f4;text-shadow:0 .02rem .1rem rgba(0,0,0,.9)}
.simchip i{font-style:normal}
.simchip{display:inline-block;margin-top:.1rem;font-size:.19rem;font-weight:700;color:#ffd391;border:.02rem solid rgba(255,179,64,.65);border-radius:.08rem;padding:.03rem .12rem;background:rgba(0,0,0,.45)}
#lbtns{position:absolute;left:.42rem;right:.26rem;top:8.66rem;display:flex;gap:.24rem;z-index:3}
.cbtn{flex:1;min-width:0;height:1.18rem;border-radius:.24rem;display:flex;align-items:center;gap:.2rem;padding:0 .22rem 0 .3rem;border:.02rem solid rgba(255,255,255,.4);background:linear-gradient(rgba(255,255,255,.13),rgba(255,255,255,.05));color:#fff;box-shadow:inset 0 .02rem 0 rgba(255,255,255,.12)}
.cbtn.red{border-color:#ff6377;background:linear-gradient(rgba(255,70,90,.24),rgba(255,70,90,.1));box-shadow:0 0 .3rem rgba(255,60,80,.45),inset 0 0 .2rem rgba(255,60,80,.25)}
.cbtn.go{border-color:rgba(120,200,255,.7);background:linear-gradient(rgba(70,150,255,.2),rgba(70,150,255,.08))}
.cbtn>svg{width:.7rem;height:.7rem;flex:none}
.cbtn.red>svg{color:#ff8a98}
.cbtn .tx{flex:1;min-width:0}
.cbtn b{display:block;font-size:.3rem;line-height:1.25;white-space:nowrap}
.cbtn .tx span{display:block;font-size:.205rem;color:#d3d7df;margin-top:.04rem;white-space:nowrap}
.cbtn.red .tx span{color:#ff9aa6}
.cbtn .cv{width:.26rem;height:.26rem;flex:none}
.cbtn:active{filter:brightness(1.35)}
/* bottom system HMI concept (not functional) */
#lrow{position:absolute;left:1.3rem;right:1.0rem;top:10.2rem;display:flex;justify-content:space-between}
#lrow button{width:.86rem;height:.7rem}#lrow svg{width:100%;height:100%}
#lrow button.dim{opacity:.38}
#lline{position:absolute;left:.5rem;right:.3rem;top:11.3rem;height:.015rem;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.35) 12%,rgba(255,255,255,.35) 88%,rgba(255,255,255,0))}
#dock{position:absolute;left:.5rem;right:.3rem;top:11.52rem;height:.84rem;display:flex}
#dock button{flex:1;display:flex;align-items:center;justify-content:center;border-left:.015rem solid rgba(255,255,255,.3);position:relative}
#dock button:first-child{border-left:0}
#dock svg{width:.78rem;height:.66rem}
#dock button.cur::after{content:"";position:absolute;left:50%;bottom:-.05rem;width:.36rem;height:.06rem;margin-left:-.18rem;border-radius:.03rem;background:rgba(255,255,255,.55)}
#ldots{position:absolute;left:0;right:0;top:12.74rem;display:flex;justify-content:center;gap:.14rem}
#ldots i{width:.1rem;height:.1rem;border-radius:.03rem;background:rgba(255,255,255,.45)}#ldots i.on{width:.42rem;background:#fff}
#syscap{position:absolute;left:0;right:0;top:13.08rem;text-align:center;font-size:.17rem;color:rgba(255,255,255,.42)}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.12}}
body.acc .haz{animation:blink 1s steps(1) infinite}
@keyframes flash{0%,49%{opacity:1}50%,100%{opacity:.12}}
.fl1{animation:flash .66s steps(1) infinite}.fl2{animation:flash .66s steps(1) infinite reverse}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.haz,.fl1,.fl2,.pulse{animation:none}}
/* ---------- right: RE:SAFETY app card (interactive re-creation of the latest R2D design) ---------- */
#app{position:absolute;left:10.56rem;top:1.4rem;right:.2rem;bottom:.68rem;border-radius:.32rem;background:#F3F5F8;overflow:hidden;display:flex;box-shadow:0 .12rem .6rem rgba(0,0,0,.55),0 0 0 .015rem rgba(255,255,255,.2)}
#app{box-shadow:0 .12rem .6rem rgba(0,0,0,.55),0 0 0 .015rem rgba(160,205,255,.3),-.34rem 0 .9rem -.36rem rgba(88,190,255,.3)}
body.acc #app{box-shadow:0 .12rem .6rem rgba(0,0,0,.55),0 0 0 .015rem rgba(255,150,165,.34),-.34rem 0 .9rem -.36rem rgba(255,55,80,.34)}
body.acc #stage{background:radial-gradient(120% 90% at 70% 40%,#1a141f 0,#0d0a12 55%,#07090e 100%)}
#rail{position:relative;width:2.02rem;background:#fff;border-right:.02rem solid #D4D9E1;flex:none}
.it{position:absolute;left:.17rem;width:1.68rem;height:1.78rem;border-radius:.3rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.12rem;font-size:.27rem}
.it svg{width:.62rem;height:.62rem}.it.on{background:#FFE6EA;font-weight:700}   /* MASTER pass: pink stays, as an accent (lighter fill) */
#q112{position:absolute;left:.29rem;bottom:.52rem;width:1.44rem;height:1.44rem;border-radius:50%;background:#2E6BE0;border:.045rem solid #8CB3F3;color:#fff;font-size:.56rem;font-weight:800;text-align:center;box-shadow:0 .05rem .16rem rgba(47,111,214,.45)}
#main{position:relative;flex:1;padding:.36rem .34rem .4rem .44rem;display:flex;flex-direction:column;min-width:0}
.mast{display:flex;align-items:center;height:.96rem;flex:none}
.mast .t{font-size:.5rem;font-weight:800;position:relative;padding-bottom:.05rem}
.mast .t::after{content:"";position:absolute;left:0;right:0;bottom:-.02rem;height:.04rem;background:#FF8499}
.mast .d{width:.03rem;height:.58rem;background:#151924;margin:0 .44rem}.mast .s{font-size:.46rem;color:#586274;flex:1}
.lab{font-size:.26rem;font-weight:700;color:#586274;margin:.26rem 0 .12rem .04rem;flex:none;display:flex;justify-content:space-between;align-items:center}
.lab button{font-size:.25rem;font-weight:700;color:#855000;padding:.02rem .06rem}
.row{display:flex;gap:.2rem}.grow{flex:1;min-height:0}
.card{flex:1;min-width:0;border-radius:var(--card-radius);border:.03rem solid #D4D9E1;background:#fff;display:flex;align-items:center;gap:var(--card-gap);padding:0 var(--card-pad-x);min-height:1.1rem;box-shadow:0 .04rem 0 rgba(40,52,78,.2);
  font-family:var(--font-ui);font-size:var(--card-title-size);font-weight:var(--card-title-weight);line-height:var(--card-title-lh);letter-spacing:var(--card-title-ls)}
.card:active{filter:brightness(.95)}
.card b{font-weight:var(--card-title-weight)}
.card .sub{display:block;font-size:var(--card-sub-size);font-weight:var(--card-sub-weight);line-height:var(--card-sub-lh);letter-spacing:0;color:#586274;margin-top:.02rem;white-space:nowrap}
.card .tx{flex:1;min-width:0;line-height:var(--card-title-lh)}
.tile{width:var(--card-icon);height:var(--card-icon);border-radius:.2rem;background:#FFE6EA;display:flex;align-items:center;justify-content:center;flex:none}
.tile svg{width:.54rem;height:.54rem}
.chev{width:.38rem;height:.38rem;flex:none}
.c119{background:#FFF6F7;border:.04rem solid #D2334A}.c119 b{color:#D2334A;font-size:var(--banner-title-size)}.c119 .tile{background:#D2334A;color:#fff}.c119 .chev{color:#D2334A}
.csos{background:#FFF9EF;border:.04rem solid #F2CE98}.csos b{color:#C0620A;font-size:var(--banner-title-size)}.csos .tile{background:#C0620A;color:#fff}.csos .chev{color:#C0620A}
.cok{background:#F6FBF9;border:.04rem solid #0E7360}.cok b{color:#0E7360}.cok .tile{background:#0E7360;color:#fff}
.cpink{background:#FFF5F6;border:.04rem solid #FF8499}.cpink .tile{background:#FF8499}
.card.plain .ic{width:var(--card-icon);height:.56rem;flex:none;display:flex;align-items:center;justify-content:center}.card.plain .ic svg{width:.56rem;height:.56rem}
.card.cont{justify-content:center;height:1.2rem;flex:none}
.card.cont em{font-style:normal;font-size:var(--card-sub-size);font-weight:var(--card-sub-weight);line-height:var(--card-sub-lh);color:#586274;margin-left:.2rem}
.back{font-size:.32rem;font-weight:700;padding:.14rem .2rem .14rem .04rem;flex:none;align-self:flex-start}
.panel{background:#fff;border:.03rem solid #D4D9E1;border-radius:.24rem;padding:.28rem .34rem}
.panel.sos{border-color:#F2CE98}
.panel h3{margin:0;font-size:.38rem;display:flex;align-items:center;gap:.14rem;flex-wrap:wrap}
.tag{font-size:.2rem;font-weight:700;padding:.03rem .12rem;border-radius:.07rem;background:#FFE6EA;color:#742F40;white-space:nowrap}
.tag.lab2{background:#FFF4E2;color:#855000}.tag.sim{background:#FFEFCF;color:#7A4A00}.tag.nat{background:#E3EEFF;color:#1d4696}.tag.oem{background:#E8EBF0;color:#343A47}.tag.ok{background:#E0F4EC;color:#0b5b4c}
.steps{margin:.16rem 0 0;padding:0;list-style:none}
.steps li{display:flex;align-items:center;gap:.16rem;font-size:.29rem;padding:.08rem 0;color:#8b9199}
.steps li i{width:.38rem;height:.38rem;border-radius:50%;border:.03rem solid #C2C8D1;flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.22rem;font-weight:800;color:#fff}
.steps li.done{color:#151924}.steps li.done i{background:#0E7360;border-color:#0E7360}
.steps li.now{color:#C0620A;font-weight:700}.steps li.now i{border-color:#C0620A;background:#FFF4E2}
.steps li.bad{color:#D2334A;font-weight:700}.steps li.bad i{background:#D2334A;border-color:#D2334A}
.steps li em{font-style:normal;color:#586274;font-weight:500;margin-left:.1rem}
.msg{font-size:.32rem;font-weight:700;margin:.14rem 0 0;color:#C0620A}.msg.bad{color:#D2334A}.msg.ok{color:#0E7360}
.btn{border-radius:.18rem;border:.03rem solid #D4D9E1;background:#fff;font-size:.31rem;font-weight:700;padding:0 .3rem;height:.9rem;text-align:center;white-space:nowrap}
.btn.sos{background:#C0620A;border-color:#C0620A;color:#fff}.btn.dark{background:#151924;border-color:#151924;color:#fff}.btn.red{background:#D2334A;border-color:#D2334A;color:#fff}
.btn:active{filter:brightness(.9)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:.2rem;font-size:.29rem;padding:.11rem 0;border-top:.02rem solid #E8EBF0}
.kv:first-of-type{border-top:0}.kv>span:first-child{color:#586274;flex:none}
.dot{display:inline-block;width:.16rem;height:.16rem;border-radius:50%;margin-right:.08rem;background:#9aa0a8}.dot.ok{background:#0E7360}.dot.bad{background:#D2334A}
.note{font-size:.235rem;color:#586274;line-height:1.5;margin:.14rem 0 0}
.body{font-size:.3rem;color:#151924;line-height:1.55;margin:.18rem 0 0}
.alert{border:.03rem solid #F2CE98;background:#FFF4E2;border-radius:.18rem;padding:.14rem .2rem;margin-top:.12rem;font-size:.27rem;font-weight:700;color:#855000;display:flex;align-items:center;gap:.14rem}

document.addEventListener('click', e => {

  const ds = el.dataset;

/* Driving-view background source.

   'vector'  = none bundled: own vector drawing. No placeholder picture is ever generated. */
const BG_FILES = { normal: 'assets/hmi/HMI_BG_01_NORMAL.png', accident: 'assets/hmi/HMI_BG_02_ACCIDENT.png' };
function setBg(n, a) { S.bg = n && a ? 'photo' : (n || a) ? 'partial' : 'vector'; $('left').dataset.bg = S.bg === 'photo' ? 'photo' : 'vector'; console.log('BG_SOURCE ' + S.bg + ' normal=' + n + ' accident=' + a);
  if (S.bg === 'photo') setBg.keep = Object.values(BG_FILES).map(u => { const im = new Image(); im.src = u; return im; }); }   // both pictures decoded up front: no blank moment at the first state change
function detectBg() {
  if (NATIVE) { let j = {}; try { j = JSON.parse(window.Native.bg ? window.Native.bg() : '{}'); } catch (e) {} return setBg(!!j.normal, !!j.accident); }
  setBg(false, false);                                              // browser preview: probe the two files, switch only if both load
  const probe = u => new Promise(res => { const im = new Image(); im.onload = () => res(im.naturalWidth > 0); im.onerror = () => res(false); im.src = u; });
  Promise.all([probe(BG_FILES.normal), probe(BG_FILES.accident)]).then(r => { if (r[0] || r[1]) { setBg(r[0], r[1]); leftKey = ''; render(); } });
}
let leftKey = '';

const FAIL_STEP = { no_config: 0, no_location: 0, no_relay: 1, auth: 1, rejected: 1, cooldown: 1 };
function sosFailStep(s, got) { return s.phase === 'expired' ? (got > 0 ? 4 : 3) : s.phase === 'failed' ? (s.kind in FAIL_STEP ? FAIL_STEP[s.kind] : 1) : -1; }   // which of the 5 steps is marked as failed
function sosHtml() {
  const s = S.sos, c = s.counts || {}, ph = s.phase;
  const got = (c.DELIVERED || 0) + (c.ACKED || 0) + (c.DECLINED || 0);
  const order = ['ready', 'sending', 'accepted', 'delivered', 'acked'];
  const idx = ph === 'nobody' ? 2 : order.indexOf(ph);
  const failAt = sosFailStep(s, got);
  const li = (i, label, extra) => { let cls = '', mark = ''; if (failAt === i) { cls = 'bad'; mark = '✕'; } else if (failAt >= 0) { cls = i < failAt ? 'done' : ''; mark = i < failAt ? '✓' : ''; } else if (i < idx || (i === idx && (ph === 'acked' || (ph === 'accepted' && i === 2) || (ph === 'delivered' && i === 3) || (ph === 'nobody' && i === 2)))) { cls = 'done'; mark = '✓'; } else if (i === idx || (i === idx + 1 && ph !== 'nobody' && ph !== 'acked' && idx >= 2)) { cls = 'now'; mark = ''; } return `<li class="${cls}"><i>${mark}</i>${label}${extra ? `<em>${extra}</em>` : ''}</li>`; };
  const connTxt = { unknown: '확인 전', checking: '확인 중', ok: '연결됨', down: '연결 안 됨', noconfig: '설정 없음' }[S.conn];
  const connCls = S.conn === 'ok' ? 'ok' : (S.conn === 'down' || S.conn === 'noconfig') ? 'bad' : '';
  let body;
  if (ph === 'consent') {
    body = `<p class="body" style="font-size:.28rem">이 실험 기능은 <b>가상 위치</b>를 PC 시험 서버로 보내 근처 시험 사용자에게 알립니다. 실제 신고나 구조 요청이 아니며, 동의한 뒤에는 홈의 SOS를 한 번 누르면 바로 요청합니다.</p>
      <div class="row" style="margin-top:.18rem"><button class="btn sos" style="flex:1" data-act="agree" data-k="agree">동의하고 요청</button><button class="btn" style="flex:1" data-act="cancel" data-k="cancel">취소</button></div>`;
  } else {
    const msg = ph === 'failed' ? `<p class="msg bad" data-k="msg">${s.err}</p>` : ph === 'expired' ? `<p class="msg bad" data-k="msg">${s.endKind === 'unknown' ? '요청 시간이 끝났어요. 서버 상태를 끝까지 확인하지 못했습니다.' : s.endKind === 'gone' ? '서버에서 요청을 찾을 수 없어요. 만료로 처리했습니다.' : '요청이 만료됐어요. 확인한 사용자가 없습니다.'} 급하면 홈의 119에 전화하세요.</p>` : ph === 'nobody' ? `<p class="msg bad" data-k="msg">지금 주변에 SOS를 받을 수 있는 사용자가 없어요.</p>`
      : ph === 'acked' ? `<p class="msg ok" data-k="msg">주변 사용자가 요청을 확인했어요.</p>` : ph === 'delivered' ? `<p class="msg" data-k="msg">주변 사용자 단말에 전달됐어요. 확인을 기다립니다.</p>`
      : ph === 'accepted' ? `<p class="msg" data-k="msg">서버가 접수했어요. 주변 사용자 ${s.matched}명에게 전달하는 중입니다.</p>` : ph === 'sending' ? `<p class="msg" data-k="msg">SOS를 보내는 중이에요…</p>` : ph === 'ready' ? `<p class="msg" data-k="msg">요청을 준비하고 있어요.</p>` : `<p class="msg" data-k="msg" style="color:#9BA5B6">홈의 SOS를 누르면 요청합니다. 지금은 아무것도 보내지 않았습니다.</p>`;
    body = `<ul class="steps">${li(0, '요청 준비')}${li(1, '요청 전송')}${li(2, '서버 접수')}${li(3, '주변 수신자 전달', (idx >= 2 && failAt < 0) || ph === 'expired' ? `대상 ${s.matched}명 · 수신 ${got}명` : '')}${li(4, '수신 확인', (idx >= 3 && failAt < 0) || ph === 'expired' ? `확인 ${c.ACKED || 0}명 · 거절 ${c.DECLINED || 0}명` : '')}</ul>${msg}
      ${s.lost >= 2 && (ph === 'accepted' || ph === 'delivered') ? `<p class="note" data-k="soslost">상태 확인 연결이 끊겼어요. 다시 연결되면 이어서 확인합니다. 급하면 홈의 119에 전화하세요.</p>` : ''}
      ${s.tries > 1 ? `<p class="note" data-k="tries">전송 시도 ${s.tries}회 (같은 요청 번호로 다시 보냄)</p>` : ''}
      <div class="row" style="margin-top:.14rem">${(ph === 'failed' || ph === 'nobody' || ph === 'expired') ? `<button class="btn sos" data-act="retry" data-k="retry">다시 시도</button>` : ''}${(ph === 'failed' && (s.kind === 'no_config' || s.kind === 'no_relay')) ? `<button class="btn" data-act="lab" data-k="labhelp">연결 안내 보기</button>` : ''}</div>`;
  }
  const alerts = S.recv.alerts.map(a => `<div class="alert"><span style="flex:1">TEST / 실제 사고 아님 · 근처 SOS 요청 (거리 ${a.band || '-'}, ${a.left}초 남음)</span><button class="btn sos" data-ack="${a.id}" data-k="ack">확인</button><button class="btn" data-dec="${a.id}">거절</button></div>`).join('');
  const pos = posText();
  return mast('근처 SOS') + `<button class="back" data-act="home" data-k="back">←  홈</button>
  <div class="scroll"><div class="panel sos"><h3>근처 SOS <span class="tag lab2">LAB · 실험</span>${SIM ? '<span class="tag sim">브라우저 시뮬레이션</span>' : ''}</h3>${body}</div>
  <div class="panel" style="margin-top:.18rem">
    <div class="kv"><span>서버 연결</span><span style="display:flex;align-items:center;gap:.16rem"><b data-k="conn"><i class="dot ${connCls}"></i>${connTxt}</b><button class="btn" style="height:.64rem;font-size:.26rem" data-act="lab" data-k="lab">시험 연결 설정</button></span></div>
    <div class="kv"><span>보내는 위치</span><span style="display:flex;align-items:center;gap:.16rem"><b>${pos ? '시험용 가상 위치' : '확인할 수 없음'}</b><button class="btn" style="height:.64rem;font-size:.26rem" data-act="loc" data-k="loc">현재 위치 확인</button></span></div>
    <div class="kv"><span>SOS 알림 받기</span><span style="display:flex;align-items:center;gap:.16rem"><b>${S.recv.on ? '켜짐' : '꺼짐'}${S.recv.note ? ' · ' + S.recv.note : ''}</b><button class="btn" style="height:.64rem;font-size:.26rem" data-act="recv" data-k="recv">${S.recv.on ? '끄기' : '켜기'}</button></span></div>
    ${alerts}
  </div>
  <p class="note">실제 신고가 아닙니다. 시험 서버와 가상 위치만 사용합니다. "서버 접수"는 서버가 요청을 받았다는 뜻이고, "수신 확인"은 받은 사람이 직접 확인을 눌렀다는 뜻입니다. 알림을 받은 사용자가 구조·응급 활동을 한다는 뜻이 아닙니다. 공식 신고는 홈의 119·112에서 하세요.</p></div>`;
}
